# 翻译环节规格
stage: translate
title: 文本翻译（带时间轴的字幕段 → 目标语字幕段）

input:
  segments: 带时间轴的字幕段（来自 ASR）
  source_language: 源语种
  target_language: 目标语种
  glossary: 术语表路径（可选，注入 prompt + 离线降级都用）

output:
  type: pipeline.contracts.TranslationResult
  fields: [segments[{index,start,end,text}], stat, warnings]
  invariants:
    - 输出段数 == 输入段数（一一对应，index 保序）   ← 这条是硬契约，翻译层最常见的坑就是漏行
    - 时间轴原样保留（不因译文长度改时间轴）
    - 未解析到的段必须回退原文并写入 warnings，不得静默丢段

metric:
  primary:
    name: 段级时长偏差 Δt
    desc: TTS 实际时长与原槽位时长之差（秒），衡量译文长度是否适配原时间轴
    threshold: 0.5
    threshold_source: C-初版值；人眼标定「字幕读起来不赶/不拖」后校准
  secondary:
    - name: 术语命中率
      desc: 术语表中的词在译文中正确出现的比例
      threshold: 0.95
      threshold_source: C-初版值
    - name: 漏解析段数
      threshold: 0
      threshold_source: 硬契约（不允许有）
    - name: 单次请求成本（美元/千段）
      threshold: 0.02
      threshold_source: B-实测（2026-11-25，4 次真实 DeepSeek 调用 32 段）
        实测 $0.00596719/千段（2026-11-25 20:24 快照）；阈值取 3 倍余量。口径：eval/cost.py --scan results/scenarios
        单价表唯一来源 = pipeline/pricing.py（官方定价页 2026-11-25 核实）
        注：历史 run 只留 total_tokens → 成本按下界计，偏保守
    - name: 翻译成本（美元/分钟音频）
      threshold: 0.001
      threshold_source: B-实测（同上；实测 $0.0000966/分钟音频，阈值取约 10 倍余量）

degrade_allowed:
  - when: 主后端超时/5xx/429
    then: 指数退避重试（1.5s×(n+1)），仍失败则切下一后端
    must_log: true
  - when: 全部在线后端失败（断网/限流/鉴权失效）
    then: 切离线降级（术语表替换 + 原文透传），stat.degraded=true 且 warnings 明示「不可对外交付」
    must_log: true
  - when: strict 模式下未命中术语表的句子
    then: 输出空串并计入 strict_miss，不得输出伪译文
    must_log: true
  - forbidden: 静默失败；静默把原文当译文而不标 degraded

budget:
  timeout_s: 30
  max_retries: 2
  peak_vram_mb: 0
  cost_usd_per_min_audio: 0.001          # 实测 $0.0000966/分钟音频（B-实测，2026-11-25 20:24 快照）
  cost_usd_per_1k_segments: 0.02         # 实测 $0.00596719/千段（同上快照）
  peak_hours_utc: [1-4, 6-10]           # DeepSeek 高峰单价 ×2 → 批量作业排到非高峰
  peak_hours_note: 中国法定节假日无法自动判断 → DEEPSEEK_PEAK_OVERRIDE=0/1 手动覆盖
  downstream_cost_note: |
    ASR/TTS 走本地栈（faster-whisper int8 / edge-tts）→ 这两段 $0。
    反事实：若换成 DeepSeek 官方托管 ASR($0.116/h) + TTS($0.45/万字符)，
    同一批素材要多花约 $0.05413 —— 是翻译本身（$0.00019）的约 283 倍。
    结论：压账单的重点不在翻译 Prompt，而在 ASR/TTS 是否托管化 + 缓存 + 分级路由。

cases:
  must_pass: [M1_01, BLG_00000]

gateway:                    # 对应「接进公司网关」——凭据只从配置读，日志只记脱敏视图
  credential_source: env_or_dotenv
  never_log: [api_key, Authorization header]
  audit_fields: [timestamp, provider, model, case_id, prompt_tokens, completion_tokens, elapsed_ms]
  degrade_to_gateway_503: 切离线降级并留痕

implementation:
  entry: pipeline/translate/openai_compatible.py（任意 OpenAI 兼容端点）
  service: pipeline/translate/registry.py（deepseek → openai_compatible → offline 自动降级）
  offline: pipeline/translate/offline.py
  config: TRANSLATE_PROVIDER / DEEPSEEK_* / OPENAI_* / TRANSLATE_TIMEOUT / TRANSLATE_MAX_RETRIES / TRANSLATE_GLOSSARY / TRANSLATE_OFFLINE_STRICT
  tests: tests/test_translate.py（19 条离线断言，含降级与漏行回退）
